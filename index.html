<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Spotify Web Player Clone – Listen to music for free with playlists, albums and more.">
    <link rel="icon" href="IMG/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
    <title>Spotify – Web Player: Music for everyone</title>
</head>

<body>

    <!-- Mobile overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Main layout wrapper -->
    <div class="container">

        <!-- ===== LEFT SIDEBAR ===== -->
        <div class="left" id="sidebar">

            <!-- Close button (mobile) -->
            <div class="close" id="closeSidebar" title="Close sidebar">
                <img width="18" src="IMG/close.svg" alt="Close" style="filter:invert(1)">
            </div>

            <!-- Home / Search nav -->
            <div class="home">
                <div class="logo">
                    <img width="120" src="IMG/logo.svg" alt="Spotify" style="filter:invert(1); display:block;">
                </div>
                <ul>
                    <li id="nav-home">
                        <img src="IMG/home.svg" alt="Home">
                        Home
                    </li>
                    <li id="nav-search">
                        <img src="IMG/search.svg" alt="Search">
                        Search
                    </li>
                </ul>
            </div>

            <!-- Your Library -->
            <div class="library">
                <div class="heading">
                    <img src="IMG/playlist.svg" alt="Library">
                    <h2>Your Library</h2>
                </div>

                <!-- Song list populated by JS -->
                <div class="songList">
                    <ul></ul>
                </div>

                <!-- Footer links -->
                <div class="footer">
                    <div><a href="https://www.spotify.com/legal/" target="_blank">Legal</a></div>
                    <div><a href="https://www.spotify.com/privacy/" target="_blank">Privacy Center</a></div>
                    <div><a href="https://www.spotify.com/legal/privacy-policy/" target="_blank">Privacy Policy</a>
                    </div>
                    <div><a href="https://www.spotify.com/legal/cookies-policy/" target="_blank">Cookies</a></div>
                    <div><a href="https://www.spotify.com/legal/privacy-policy/#s3" target="_blank">About Ads</a></div>
                    <div><a href="https://www.spotify.com/accessibility/" target="_blank">Accessibility</a></div>
                    <p style="width:100%; color:#6a6a6a; margin-top:6px;">© 2026 Spotify AB</p>
                </div>
            </div>
        </div>
        <!-- ===== END LEFT SIDEBAR ===== -->


        <!-- ===== RIGHT MAIN PANEL ===== -->
        <div class="right bg-grey rounded">

            <!-- Top header bar -->
            <div class="header">
                <!-- Nav arrows + hamburger -->
                <div class="hamburgerContainer">
                    <img width="32" class="hamburger" id="hamburgerBtn" src="IMG/hamburger.svg" alt="Open sidebar">
                    <!-- Back arrow -->
                    <svg id="navBackBtn" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        title="Back" style="cursor:pointer;">
                        <path
                            d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                            stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <!-- Forward arrow -->
                    <svg id="navFwdBtn" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        title="Forward" style="cursor:pointer;">
                        <path
                            d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                            stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>

                <!-- Signup / Login -->
                <div class="buttons">
                    <button class="signupbtn" id="signupBtn">Sign up</button>
                    <button class="loginbtn" id="loginBtn">Log in</button>
                </div>
            </div>

            <!-- ===== HOME VIEW (card grid) ===== -->
            <div class="spotifyPlaylists" id="homeView">
                <h1 id="greetingHeading">Good afternoon 👋</h1>
                <div class="cardContainer" id="cardContainer"></div>
            </div>

            <!-- ===== ALBUM VIEW (hidden initially) ===== -->
            <div class="albumView" id="albumView" style="display:none;">
                <!-- Hero header -->
                <div class="album-hero" id="albumHero">
                    <img class="album-hero-cover" id="albumHeroCover" src="" alt="Album Art">
                    <div class="album-hero-info">
                        <span class="album-type-label">PLAYLIST</span>
                        <h1 class="album-hero-title" id="albumHeroTitle">Album Name</h1>
                        <p class="album-hero-desc" id="albumHeroDesc">Description</p>
                        <div class="album-hero-meta">
                            <span id="albumSongCount">0 songs</span>
                        </div>
                    </div>
                </div>

                <!-- Action bar -->
                <div class="album-actions">
                    <button class="album-play-all" id="albumPlayAllBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M5 3L19 12L5 21V3Z" fill="#000"/>
                        </svg>
                        Play
                    </button>
                    <button class="album-shuffle-btn" id="albumShuffleBtn" title="Shuffle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M16 3h5v5M4 20L21 3M16 21h5v-5M4 4l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>

                <!-- Track table header -->
                <div class="track-table-header">
                    <span class="col-num">#</span>
                    <span class="col-title">Title</span>
                    <span class="col-duration">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </span>
                </div>
                <div class="track-list-divider"></div>

                <!-- Track rows populated by JS -->
                <div class="track-list" id="albumTrackList"></div>
            </div>

        </div>
        <!-- ===== END RIGHT PANEL ===== -->

    </div>
    <!-- ===== END CONTAINER ===== -->


    <!-- ===== PLAYBAR (fixed bottom) ===== -->
    <div class="playbar" id="playbar">
        <div class="abovebar">

            <!-- LEFT: Song info -->
            <div class="songinfo" id="songInfoPanel">
                <div class="songinfo-albumart" id="albumArtWrap">
                    <!-- Album art loaded by JS -->
                    <img src="IMG/music.svg" alt="Album art" id="albumArtImg">
                </div>
                <div class="songinfo-text">
                    <div class="songinfo-title" id="songTitleDisplay">–</div>
                    <div class="songinfo-artist" id="songArtistDisplay">Select a playlist to start</div>
                </div>
            </div>

            <!-- CENTER: Controls + seekbar -->
            <div class="songbuttons-wrap">
                <!-- Control buttons -->
                <div class="songbuttons">
                    <!-- Shuffle -->
                    <img width="20" class="ctrl-icon" id="shuffleBtn" src="IMG/prevsong.svg" alt="Shuffle"
                        title="Shuffle" style="opacity:0.6">
                    <!-- Previous -->
                    <img width="28" id="previous" src="IMG/prevsong.svg" alt="Previous">
                    <!-- Play/Pause -->
                    <img width="38" id="play" src="IMG/play.svg" alt="Play">
                    <!-- Next -->
                    <img width="28" id="next" src="IMG/nextsong.svg" alt="Next">
                    <!-- Repeat -->
                    <img width="20" class="ctrl-icon" id="repeatBtn" src="IMG/nextsong.svg" alt="Repeat" title="Repeat"
                        style="opacity:0.6">
                </div>

                <!-- Seek row -->
                <div class="seek-area">
                    <span class="songtime" id="currentTime">0:00</span>
                    <div class="seekbar" id="seekbar">
                        <div class="circle" id="circle"></div>
                    </div>
                    <span class="songtime" id="totalTime">0:00</span>
                </div>
            </div>

            <!-- RIGHT: Volume -->
            <div class="timevol">
                <div class="volume" id="volumeControl">
                    <img width="20" src="IMG/volume.svg" alt="Volume" id="volumeIcon">
                    <div class="range">
                        <input type="range" name="volume" id="volumeSlider" min="0" max="100" value="70">
                    </div>
                </div>
            </div>

        </div>
    </div>
    <!-- ===== END PLAYBAR ===== -->

    <script src="script.js"></script>
</body>

</html>
